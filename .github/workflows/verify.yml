# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Build and Verify

on:
  push:
    branches: 
       - '**'
  pull_request:
    branches: [ "master" ]

jobs:
  build-verify:
    name: mvn verify (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    # JDK 21 is the supported baseline; newer JDKs are checked early but do not block
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: '21'
            experimental: false
          - java: '25'
            experimental: true

    steps:
    - name: Checkout Code 📘
      uses: actions/checkout@v4
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        cache: maven
    - name: Set up Maven  🍮
      uses: stCarolas/setup-maven@v5
      with:
        maven-version: 3.9.16
    - name: Build and Verify ⚒️🧪
      run: xvfb-run -a mvn -B verify --file pom.xml
    
    #- name: Publish Test Report 🔍
    #  uses: mikepenz/action-junit-report@v3
    #  if: always() # always run even if the previous step fails
    #  with:
    #    report_paths: '**/target/surefire-reports/TEST-*.xml'
    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2.3.0
      if: always()  # always run even if the previous step fails
      with:
        check_name: "Test Results (JDK ${{ matrix.java }})"
        junit_files: "**/target/surefire-reports/TEST-*.xml"
